[project]
name = "paperread"
version = "0.1.0"
description = "CLI tool for searching and downloading arXiv papers."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hsy", email = "hsiaosiyuan@gmail.com" }]
dependencies = [
    "arxiv>=2.1.3",
    "markdown-it-py>=3.0.0",
    "marker-pdf>=1.10.2",
    "markitdown[pdf]>=0.0.1a3",
    "platformdirs>=4.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "edge-tts>=7.2.8",
    "pysbd>=0.3.4",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
paperread = "paperread.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperread"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# report.py embeds an HTML/CSS/JS template as a string literal; line length
# rules don't usefully apply to URLs or CDN script tags.
"src/paperread/report.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
pythonpath = ["src"]
